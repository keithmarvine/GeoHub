<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="22"/></clipPath>
    <radialGradient id="bg" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#060f20"/>
    </radialGradient>
  </defs>

  <!-- Rounded square bg -->
  <rect width="64" height="64" rx="14" fill="#0d1829"/>

  <!-- Globe sphere -->
  <circle cx="32" cy="32" r="22" fill="url(#bg)"/>

  <!-- Grid lines clipped to sphere -->
  <g clip-path="url(#c)" stroke="#b8945a" fill="none">
    <!-- Equator -->
    <line x1="10" y1="32" x2="54" y2="32" stroke-width="0.9" opacity="0.65"/>
    <!-- Latitude +30 -->
    <line x1="14" y1="21" x2="50" y2="21" stroke-width="0.7" opacity="0.4"/>
    <!-- Latitude -30 -->
    <line x1="14" y1="43" x2="50" y2="43" stroke-width="0.7" opacity="0.4"/>
    <!-- Central meridian ellipse -->
    <ellipse cx="32" cy="32" rx="12" ry="22" stroke-width="0.8" opacity="0.5"/>
    <!-- Left meridian -->
    <ellipse cx="32" cy="32" rx="5"  ry="22" stroke-width="0.6" opacity="0.3"/>
    <!-- Right meridian -->
    <ellipse cx="32" cy="32" rx="20" ry="22" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Globe rim -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#b8945a" stroke-width="1.4" opacity="0.8"/>

  <!-- Hub dot with pulse ring -->
  <circle cx="32" cy="32" r="5.5" fill="#b8945a" opacity="0.2"/>
  <circle cx="32" cy="32" r="3.2" fill="#b8945a"/>
  <circle cx="32" cy="32" r="1.4" fill="#0d1829"/>

  <!-- Network spokes -->
  <g stroke="#b8945a" stroke-width="0.8" opacity="0.45">
    <line x1="32" y1="32" x2="32" y2="11"/><circle cx="32" cy="11" r="1.2" fill="#b8945a"/>
    <line x1="32" y1="32" x2="48" y2="22"/><circle cx="48" cy="22" r="1.2" fill="#b8945a"/>
    <line x1="32" y1="32" x2="48" y2="43"/><circle cx="48" cy="43" r="1.2" fill="#b8945a"/>
    <line x1="32" y1="32" x2="32" y2="53"/><circle cx="32" cy="53" r="1.2" fill="#b8945a"/>
    <line x1="32" y1="32" x2="16" y2="43"/><circle cx="16" cy="43" r="1.2" fill="#b8945a"/>
    <line x1="32" y1="32" x2="16" y2="22"/><circle cx="16" cy="22" r="1.2" fill="#b8945a"/>
  </g>
</svg>
