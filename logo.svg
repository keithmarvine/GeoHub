<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" fill="none">
  <defs>
    <clipPath id="lc"><circle cx="22" cy="22" r="16"/></clipPath>
    <radialGradient id="lbg" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#060f20"/>
    </radialGradient>
  </defs>

  <!-- ── ICON MARK ── -->
  <!-- Sphere -->
  <circle cx="22" cy="22" r="16" fill="url(#lbg)"/>

  <!-- Grid clipped -->
  <g clip-path="url(#lc)" stroke="#b8945a" fill="none">
    <line x1="6"  y1="22" x2="38" y2="22" stroke-width="0.7" opacity="0.7"/>
    <line x1="9"  y1="15" x2="35" y2="15" stroke-width="0.55" opacity="0.4"/>
    <line x1="9"  y1="29" x2="35" y2="29" stroke-width="0.55" opacity="0.4"/>
    <ellipse cx="22" cy="22" rx="8.5" ry="16" stroke-width="0.65" opacity="0.55"/>
    <ellipse cx="22" cy="22" rx="3.5" ry="16" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="22" cy="22" rx="14" ry="16" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Rim -->
  <circle cx="22" cy="22" r="16" stroke="#b8945a" stroke-width="1.1" opacity="0.85"/>

  <!-- Hub dot -->
  <circle cx="22" cy="22" r="4"   fill="#b8945a" opacity="0.18"/>
  <circle cx="22" cy="22" r="2.4" fill="#b8945a"/>
  <circle cx="22" cy="22" r="1"   fill="#060f20"/>

  <!-- Spokes -->
  <g stroke="#b8945a" stroke-width="0.65" opacity="0.5">
    <line x1="22" y1="22" x2="22" y2="7"/><circle cx="22" cy="7"  r="0.9" fill="#b8945a"/>
    <line x1="22" y1="22" x2="35" y2="14.5"/><circle cx="35" cy="14.5" r="0.9" fill="#b8945a"/>
    <line x1="22" y1="22" x2="35" y2="30"/><circle cx="35" cy="30"  r="0.9" fill="#b8945a"/>
    <line x1="22" y1="22" x2="22" y2="37"/><circle cx="22" cy="37"  r="0.9" fill="#b8945a"/>
    <line x1="22" y1="22" x2="9"  y2="30"/><circle cx="9"  cy="30"  r="0.9" fill="#b8945a"/>
    <line x1="22" y1="22" x2="9"  y2="14.5"/><circle cx="9" cy="14.5" r="0.9" fill="#b8945a"/>
  </g>

  <!-- ── WORDMARK ── -->
  <!-- "GeoHuB" -->
  <text x="52" y="28"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.3"
    fill="#162035">GeoHu<tspan fill="#b8945a">B</tspan></text>

  <!-- Divider -->
  <line x1="136" y1="10" x2="136" y2="34" stroke="#c8c8c8" stroke-width="0.8" opacity="0.5"/>

  <!-- "The Spatial Network" -->
  <text x="143" y="20"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="7.5"
    font-weight="400"
    letter-spacing="0.12"
    fill="#6b7a99"
    text-transform="uppercase">THE SPATIAL</text>
  <text x="143" y="31"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="7.5"
    font-weight="400"
    letter-spacing="0.12"
    fill="#6b7a99">NETWORK</text>
</svg>
